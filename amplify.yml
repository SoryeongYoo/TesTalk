version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.7.0 --activate
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - cd ../.. && pnpm turbo run build --filter=web
      artifacts:
        # appRoot 기준 상대 경로 -> 실제로는 apps/web/.next
        # next.config.mjs의 output: "standalone" 설정을 Amplify의 Next.js
        # SSR 컴퓨트 플랫폼이 .next 디렉터리를 통해 자동으로 인식/패키징한다.
        # .next/standalone으로 baseDirectory를 바꾸지 말 것 (public/static 누락됨).
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
