version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.7.0 --activate
            # 상대경로 cd(../..)는 phase마다 시작 cwd가 달라 누적 오차가 생겼다
            # (preBuild는 appRoot에서 시작하지만, build는 preBuild가 끝난 cwd를
            # 이어받아 이미 repo 루트인 상태에서 다시 두 단계 올라가
            # ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND가 발생함, 실제 빌드 로그로 확인).
            # 그래서 각 phase 첫 명령에서 현재 cwd 기준으로 pnpm-workspace.yaml이
            # 있는 지점까지 위로 탐색해 repo 루트 절대경로를 찾는다 — 시작 cwd가
            # 어디든(appRoot든 이미 루트든) 항상 같은 위치로 수렴한다.
            - ROOT_DIR=$(pwd); while [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ] && [ "$ROOT_DIR" != "/" ]; do ROOT_DIR=$(dirname "$ROOT_DIR"); done; cd "$ROOT_DIR" && pnpm install --frozen-lockfile
        build:
          commands:
            - ROOT_DIR=$(pwd); while [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ] && [ "$ROOT_DIR" != "/" ]; do ROOT_DIR=$(dirname "$ROOT_DIR"); done; cd "$ROOT_DIR" && pnpm turbo run build --filter=web
      artifacts:
        # appRoot 기준 상대 경로 -> 실제로는 apps/web/.next
        # next.config.mjs의 output: "standalone" 설정을 Amplify의 Next.js
        # SSR 컴퓨트 플랫폼이 .next 디렉터리를 통해 자동으로 인식/패키징한다.
        # .next/standalone으로 baseDirectory를 바꾸지 말 것 (public/static 누락됨).
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
