version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.7.0 --activate
            # 상대경로 cd(../..)는 phase마다 시작 cwd가 달라 누적 오차가 생겼다
            # (preBuild는 appRoot에서 시작하지만, build는 preBuild가 끝난 cwd를
            # 이어받아 이미 repo 루트인 상태에서 다시 두 단계 올라가
            # ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND가 발생함, 실제 빌드 로그로 확인).
            # 그래서 각 phase 첫 명령에서 현재 cwd 기준으로 pnpm-workspace.yaml이
            # 있는 지점까지 위로 탐색해 repo 루트 절대경로를 찾는다 — 시작 cwd가
            # 어디든(appRoot든 이미 루트든) 항상 같은 위치로 수렴한다.
            - ROOT_DIR=$(pwd); while [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ] && [ "$ROOT_DIR" != "/" ]; do ROOT_DIR=$(dirname "$ROOT_DIR"); done; cd "$ROOT_DIR" && pnpm install --frozen-lockfile
        build:
          commands:
            # Amplify 콘솔 환경변수는 빌드에만 주입되고 SSR 런타임에는 전달되지 않는다.
            # 그래서 빌드 중에 서버가 읽는 변수만 골라 apps/web/.env.production으로
            # 그 자리에서 생성한다. 비밀값은 Amplify 환경변수에만 있고, git에는 이
            # 생성 명령만 있다(.env.production은 .gitignore 대상).
            # 로그에는 값이 아니라 키 이름만 출력한다 — 파일을 cat하지 말 것.
            # TOSS_CLIENT_KEY/TOSS_SECRET_KEY: 토스 결제 키(콘솔에 없으면 결제는 "준비 중").
            # ⚠️ TESTALK_ALLOW_TEST_GRANT(무료 테스트 지급)는 일부러 넣지 않는다 — 프로덕션 안전장치.
            - ROOT_DIR=$(pwd); while [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ] && [ "$ROOT_DIR" != "/" ]; do ROOT_DIR=$(dirname "$ROOT_DIR"); done; env | grep -E '^(ANTHROPIC_API_KEY|COGNITO_[A-Z_]+|AUTH_[A-Z_]+|NEXTAUTH_[A-Z_]+|DATABASE_[A-Z_]+|DAILY_FREE_GENERATIONS|TOSS_CLIENT_KEY|TOSS_SECRET_KEY)=' > "$ROOT_DIR/apps/web/.env.production"; echo "wrote .env.production keys:"; cut -d= -f1 "$ROOT_DIR/apps/web/.env.production"
            - ROOT_DIR=$(pwd); while [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ] && [ "$ROOT_DIR" != "/" ]; do ROOT_DIR=$(dirname "$ROOT_DIR"); done; cd "$ROOT_DIR" && pnpm turbo run build --filter=web
      artifacts:
        # appRoot 기준 상대 경로 -> 실제로는 apps/web/.next
        # next.config.mjs의 output: "standalone" 설정을 Amplify의 Next.js
        # SSR 컴퓨트 플랫폼이 .next 디렉터리를 통해 자동으로 인식/패키징한다.
        # .next/standalone으로 baseDirectory를 바꾸지 말 것 (public/static 누락됨).
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
